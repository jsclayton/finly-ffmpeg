name: build

# Repeatable FFmpeg build pipeline: bump version, re-run, release.
# Runs on macOS runners which ship Xcode + iOS/tvOS SDKs + simulators.
#
# Builds the four xcframeworks + the LGPL compliance bundle and runs the
# simulator smoke test — a from-scratch REPRODUCIBILITY CHECK, not the release
# publisher. Releases are cut by scripts/release.sh from the locally built,
# suite-verified artifacts: the checksums in Package.swift must match the exact
# bytes uploaded, so a runner rebuild must never overwrite release assets.
#
# TRIGGERS ONLY ON A `v*` TAG (or a manual `workflow_dispatch`). Pushing a
# branch, pushing `main`, and opening a pull request all do nothing. This is
# deliberate: a full 6-arch FFmpeg cross-compile is far too heavy to run on every
# push and PR. Tag a release and the pipeline runs; day-to-day iteration builds
# locally with `./build.sh`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed for the release job on tags

jobs:
  build:
    # Xcode 27 ships on its own image (`xcode-27`, macOS 27); `macos-26` has no Xcode 27.
    runs-on: xcode-27
    env:
      # The Xcode the releases are built with, by version and build. A beta or another point
      # release on the image is never picked by sorting: the image carries 27.0, 27.1 and a 27.2
      # beta side by side. Bump both together when the release toolchain moves.
      XCODE_VERSION: "27.1"
      XCODE_BUILD: "27A9275"
    steps:
      - uses: actions/checkout@v4

      # No fallback: a missing or different Xcode fails here instead of checking the build with
      # another toolchain (until 2026-10-06 it silently fell back to Xcode 26.3).
      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$XCODE" ]]; then
            echo "::error::no Xcode ${XCODE_VERSION} on this runner image"; ls -d /Applications/Xcode_*.app; exit 1
          fi
          sudo xcode-select -s "$XCODE"
          build="$(xcodebuild -version | awk '/^Build version/ { print $3 }')"
          if [[ "$build" != "$XCODE_BUILD" ]]; then
            echo "::error::Xcode ${XCODE_VERSION} on this image is build ${build}, not ${XCODE_BUILD}"; exit 1
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk appletvos --show-sdk-version

      - name: Build xcframeworks + LGPL bundle
        run: ./build.sh

      - name: Smoke test (simulator link + run)
        run: ./scripts/smoke-test.sh

      # The release's own zip step, so these zips have the layout and pass the
      # checks of the ones a release uploads (no AppleDouble entries, the
      # .xcframework at the root). It prints each zip's SwiftPM checksum.
      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          bash scripts/zip-xcframeworks.sh dist
          cp artifacts/lgpl/*.tar.gz dist/
          ( cd dist && shasum -a 256 *.xcframework.zip *.tar.gz > checksums.txt && cat checksums.txt )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xcframeworks
          path: dist/
          retention-days: 14
