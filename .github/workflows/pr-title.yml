name: PR Title

# Kept apart from CI so that editing a PR title or body re-runs only this
# check, not the whole test suite.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-title:
    name: PR Title
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    steps:
      # A squash merge adds " (#NNNN)" (up to 8 characters) to the title, and the
      # history on main keeps a commit header to 100 characters.
      - name: Leave room for the number a squash merge adds
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "${#TITLE}" -gt 92 ]; then
            echo "::error::The title is ${#TITLE} characters. Keep it to 92 or fewer: the squash merge adds \" (#NNNN)\", and a commit header on main stays at 100 or fewer."
            exit 1
          fi
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the pull request title "{title}"
            must not start with an uppercase character.
